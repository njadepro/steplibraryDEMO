<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Motrix Access</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#000;
  color:#fff;
  overflow:hidden;
  transition:1.5s ease;
}

/* CENTER */
.screen{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:20px;
}

/* FLOAT */
@keyframes softFloat {
  0%   { transform: translateY(0px); }
  50%  { transform: translateY(-2px); }
  100% { transform: translateY(0px); }
}

/* TEXT */
.text{
  font-family: Arial, Helvetica, sans-serif;
  font-size:18px;
  letter-spacing:3px;
  text-transform:uppercase;
  max-width:90%;
  line-height:1.4;

  animation: softFloat 6s ease-in-out infinite;
  text-shadow: 0 0 6px rgba(255,255,255,0.08);
}

/* SPRAY ENTRY */
@keyframes sprayIn {
  0% {
    opacity: 0;
    transform: translate(2px, 2px) scale(1.3) rotate(-8deg);
    filter: blur(2px);
  }
  60% {
    opacity: 1;
    transform: translate(0px, 0px) scale(1) rotate(2deg);
    filter: blur(0px);
  }
  100% {
    transform: translate(0px, 0px) scale(1) rotate(0deg);
  }
}

/* LETTER BASE */
#text span {
  display:inline-block;
}

/* INPUT */
input{
  width:260px;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.05);
  color:#fff;
  text-align:center;
  display:none;
  outline:none;
}

input:focus{
  border-color:#1e90ff;
  box-shadow:0 0 10px rgba(30,144,255,0.3);
}

/* VIDEO */
#bg-video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-20;

  filter: grayscale(1) blur(8px) contrast(1.1) brightness(0.7);
  transform: scale(1.05);
}

.video-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-10;
  background:rgba(255,255,255,0.08);
  pointer-events:none;
}
</style>
</head>

<body>

<div class="video-overlay"></div>

<video id="bg-video" autoplay muted loop playsinline>
  <source src="components/bgvideo.mp4" type="video/mp4">
</video>

<div class="screen">
  <div class="text" id="text"></div>
  <input type="password" id="password" placeholder="CODE D’ACCÈS"/>
</div>

<!-- SOUND -->
<audio id="keySound" src="https://assets.mixkit.co/sfx/preview/mixkit-typewriter-soft-click-1125.mp3"></audio>

<!-- MUSIC -->
<audio id="bg-music" loop preload="auto">
  <source src="components/bgmusic.mp3" type="audio/mpeg">
</audio>

<script>

const textEl = document.getElementById("text");
const input = document.getElementById("password");
const keySound = document.getElementById("keySound");
const music = document.getElementById("bg-music");

const PASSWORD = "MOTRIXPROJECT";

/* ================= MUSIC FIX ================= */

function fadeInMusic(target = 0.4, duration = 2500){
  let step = target / (duration / 50);

  const fade = setInterval(() => {
    if (music.volume < target){
      music.volume = Math.min(music.volume + step, target);
    } else {
      clearInterval(fade);
    }
  }, 50);
}

/* REAL USER INTERACTION UNLOCK (IMPORTANT FIX) */
function enableAudio(){
  music.play().then(() => {
    music.volume = 0;
    fadeInMusic(0.4, 3000);
  }).catch(() => {});

  document.removeEventListener("click", enableAudio);
  document.removeEventListener("keydown", enableAudio);
  document.removeEventListener("touchstart", enableAudio);
}

document.addEventListener("click", enableAudio);
document.addEventListener("keydown", enableAudio);
document.addEventListener("touchstart", enableAudio);

/* MUSIC START (SAFE) */
function startMusic(){
  music.volume = 0;

  music.play().then(() => {
    fadeInMusic(0.4, 3000);
  }).catch(() => {});
}

/* ================= TYPE EFFECT ================= */
function typeText(text, speed = 40, callback){
  let i = 0;
  textEl.innerHTML = "";

  const interval = setInterval(() => {

    const char = text[i];
    const span = document.createElement("span");

    if (char === " ") {
      span.innerHTML = "&nbsp;";
      span.style.width = "10px";
    } else {
      span.textContent = char;
      span.style.animation = "sprayIn 0.25s ease-out";

      const jitter = (Math.random() - 0.5) * 1.5;
      span.style.transform = `rotate(${jitter}deg)`;
    }

    textEl.appendChild(span);

    if(char && char !== " "){
      keySound.currentTime = 0;
      keySound.play();
    }

    i++;

    if(i >= text.length){
      clearInterval(interval);
      if(callback) callback();
    }

  }, speed);
}

/* ================= BOOT ================= */
window.addEventListener("load", () => {

  startMusic();

  setTimeout(() => {

    typeText("INITIALISATION DU SYSTÈME . . .", 40, () => {

      setTimeout(() => {

        typeText("CONNEXION STABLE . . .", 40, () => {

          setTimeout(() => {

            typeText("DEMANDE D'ACCÈS DÉTECTÉE . . .", 40, () => {

              input.style.display = "block";
              input.focus();

              typeText("ENTREZ LE CODE D'ACCÈS", 35);

            });

          }, 500);

        });

      }, 500);

    });

  }, 1200);

});

/* ================= PASSWORD ================= */
input.addEventListener("input", () => {

  if(input.value === PASSWORD){

    music.volume = 0;

    input.style.display = "none";

    typeText("ACCÈS AUTORISÉ", 40, () => {

      setTimeout(() => {
        document.body.style.opacity = "0";

        setTimeout(() => {
          window.location.href = "pages/dashboard.html";
        }, 1200);

      }, 800);

    });

  }

});

</script>

</body>
</html>
