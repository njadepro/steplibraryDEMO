<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Motrix - Play</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
  overflow:hidden;
}

/* ===== GLOW ===== */
.glow{
  position:absolute;
  width:350px;
  height:380px;
  z-index: -10;
  background:#1e90ff;
  filter:blur(160px);
  opacity:0.18;
  border-radius:80%;
}

/* ===== TOP HEADER ===== */
.top-header{
  width:100%;
  padding:18px 16px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.02);
  backdrop-filter:blur(10px);
}

/* centered title block */
.header-center{
  text-align:center;
  margin-bottom:14px;
}

.main-title{
  font-size:22px;
  font-weight:800;
  letter-spacing:1px;
}

.sub-line{
  font-size:12px;
  opacity:0.5;
  margin-top:4px;
}

/* profile row */
.profile{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
}

/* left side (avatar + name) */
.avatar-wrap{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,0.15);
  cursor:pointer;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name-block{
  display:flex;
  flex-direction:column;
}

.name{
  font-size:14px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
}

/* SYSTEM ACTIVE moved here */
.system-active{
  font-size:9px;
  letter-spacing:1.5px;
  padding:3px 6px;
  border-radius:6px;
  background:rgba(30,144,255,0.15);
  border:1px solid rgba(30,144,255,0.3);
  color:#1e90ff;
}

.level{
  font-size:12px;
  opacity:0.6;
  margin-top:2px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;

  display:flex;
  align-items:center;
  gap:12px;

  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  border-color:#1e90ff;
  transform:translateY(-2px);
}

.card i{
  width:22px;
  height:22px;
  stroke:#1e90ff;
}

.card h3{
  margin:0;
  font-size:15px;
}

.card p{
  margin:4px 0 0;
  font-size:12px;
  color:rgba(255,255,255,0.5);
}

/* ===== BOTTOM ===== */
.bottom-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  display:flex;
  justify-content:space-around;
  padding:14px 0;

  background:#000;
  border-top:1px solid rgba(255,255,255,0.1);
}

.tab{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:10px;
  color:rgba(255,255,255,0.4);
  gap:4px;
  cursor:pointer;

  justify-content:center;
  font-size:10px;
  text-align:center;
  min-width:60px;
}

.tab svg{
  width:22px;
  height:22px;
}

.tab.active{
  color:#1e90ff;
}

.tab.active svg{
  stroke:#1e90ff;
}

</style>
</head>

<body>
  
<div class="glow"></div>

<!-- HEADER -->
<div class="top-header">

  <div class="header-center">
    <div class="main-title">DJ BOOTH</div>
    <div class="sub-line">Développe ton oreille, ton rythme et ton flow</div>
  </div>

  <div class="profile">
    <div class="avatar-wrap">
      <label class="avatar" for="upload"></label>
      <div class="name-block">
        <div class="name">NOEL</div>
        <div class="level">
          LEVEL 3 • FLOW ARCHITECT
          <span class="system-active">SYSTEM ACTIVE</span>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- BOTTOM -->
<div class="bottom-bar">

  <div class="tab" onclick="window.location='dashboard.html'">
    <i data-lucide="activity"></i>
    EVOLUTION
  </div> 

  <div class="tab" onclick="window.location='health.html'">
    <i data-lucide="heart-plus"></i>
    SANTÉ
  </div>

  <div class="tab" onclick="window.location='playground.html'">
    <i data-lucide="gamepad-2"></i>
    JOUER
  </div>

  <div class="tab active">
    <i data-lucide="headphones"></i>
    MUSIC
  </div>

  <div class="tab" onclick="window.location='library.html'">
    <i data-lucide="box"></i>
    BIBLIOTHÈQUE
  </div>

</div>

<script>
lucide.createIcons();
</script>

</body>
</html>
